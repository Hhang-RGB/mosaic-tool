<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Dot Generator · Image Halftone Tool</title>
  <link rel="icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAIAAACQkWg2AAAAK0lEQVR42mM89LOPgRTAxEAioEBDmEJPmEIPfjY5NjDS0dOjfhgcfiASAADP+RtlkrC83wAAAABJRU5ErkJggg==">
  <style>
:root {
  font-family: Inter, system-ui, -apple-system, "Segoe UI", "Noto Sans SC", sans-serif;
  color: #18191a;
  background: #f0f1f4;
  --panel: #fff;
  --radius: 10px;
  --module-gap: 23px;
  --header-height: clamp(58px, 5.5vw, 80px);
  --side-padding: clamp(19px, 2.1vw, 32px);
  --ink: #18191a;
  --muted: #5c6068;
  --line: #e6e7eb;
  --control-line: #d5d7de;
  --soft: #f4f4f7;
  --lime: #baf681;
  --lime-hover: #a8e969;
  --lime-soft: #ebfbdc;
  --focus: #476d2a;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}
body, h1, h2, p { margin: 0; }
body { min-height: 100vh; }
html:lang(zh-CN) {
  font-family: "PingFang SC", "Noto Sans CJK SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  font-weight: 400;
  font-synthesis: none;
}
button, input { font: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .55; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }

.topbar {
  display: flex;
  height: var(--header-height);
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding-inline: var(--side-padding);
  border-bottom: 1px solid var(--line);
  background: var(--panel);
}
.brand { display: flex; align-items: center; gap: 12px; font-size: 19px; font-weight: 700; white-space: nowrap; }
.brand-mark { display: grid; place-items: center; width: 32px; height: 32px; border-radius: var(--radius); background: var(--lime); }
.brand-mark::before { content: ""; width: 21px; height: 21px; background: radial-gradient(circle, var(--ink) 1.25px, transparent 1.65px) 0 0 / 7px 7px; }

.switch {
  position: relative;
  display: inline-flex;
  min-height: 40px;
  align-items: center;
  gap: 8px;
  padding: 4px 9px;
  border-radius: var(--radius);
  color: var(--ink);
  font-size: 12px;
  font-weight: 650;
  cursor: pointer;
}
.switch input { position: absolute; z-index: 1; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.choice input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.switch:has(input:focus-visible) { outline: 2px solid var(--focus); outline-offset: 1px; }
.switch-track { position: relative; width: 38px; height: 20px; border-radius: var(--radius); background: #dfe1e6; transition: background .15s; }
.switch-track::after {
  position: absolute;
  top: 3px;
  left: 3px;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--ink);
  content: "";
  transition: transform .15s;
}
.language-control .switch-track { background: var(--lime); }
.switch input:checked + .switch-track::after { transform: translateX(18px); }
.language-control:has(input:checked) .language-en,
.language-control:has(input:not(:checked)) .language-zh { color: var(--muted); font-weight: 500; }

.workspace {
  display: grid;
  grid-template-areas: "controls preview";
  grid-template-columns: clamp(290px, 28.8vw, 470px) minmax(0, 1fr);
  height: calc(100vh - var(--header-height));
  height: calc(100dvh - var(--header-height));
}
.preview, .controls { min-width: 0; min-height: 0; }
.controls {
  grid-area: controls;
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--line);
  background: var(--panel);
}
.controls-scroll {
  display: flex;
  flex: 1;
  min-height: 0;
  flex-direction: column;
  gap: var(--module-gap);
  padding: var(--module-gap) var(--side-padding);
  overflow-y: auto;
  scrollbar-width: thin;
}
h2 { font-size: 19px; font-weight: 680; line-height: 1.4; }
.preview { position: relative; grid-area: preview; }
.preview-header {
  position: absolute;
  z-index: 1;
  inset: 15px var(--side-padding) auto;
  display: flex;
  justify-content: space-between;
  gap: 8px;
  pointer-events: none;
}
.view-switch, .zoom-controls {
  display: flex;
  gap: 2px;
  padding: 3px;
  border-radius: var(--radius);
  background: #eeeef2;
  white-space: nowrap;
  pointer-events: auto;
}
.view-switch button, .zoom-controls button {
  min-height: 29px;
  padding: 4px 11px;
  border: 1px solid transparent;
  border-radius: var(--radius);
  color: var(--muted);
  background: transparent;
  font-size: 12px;
}
.view-switch button:hover, .zoom-controls button:hover:enabled { color: var(--ink); }
.view-switch button[aria-pressed="true"] {
  border-color: var(--line);
  color: var(--ink);
  background: #fff;
  font-weight: 650;
  box-shadow: 0 1px 2px #18191a12;
}
.zoom-controls button { padding-inline: 7px; }
.zoom-controls button:first-child, .zoom-controls button:last-child { width: 27px; font-size: 15px; line-height: 1; }
#zoom-reset { min-width: 49px; color: var(--ink); background: #fff; font-variant-numeric: tabular-nums; }
.preview-stage {
  display: grid;
  grid-template-rows: minmax(0, 1fr);
  place-items: center;
  height: 100%;
  overflow: hidden;
  padding: 66px clamp(18px, 5vw, 88px) 36px;
  background: radial-gradient(circle, #dadde4 .85px, transparent 1.2px) 0 0 / 13px 13px #fff;
}
.preview-image {
  width: min(100%, 1050px);
  height: 100%;
  pointer-events: none;
}
.preview-stage canvas {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
}
.preview-stage.can-pan { cursor: grab; touch-action: none; }
.preview-stage.is-panning { cursor: grabbing; }
.placeholder { padding: 12px; border-radius: var(--radius); color: var(--muted); background: var(--panel); text-align: center; font-size: 13px; }
#image-name { margin-top: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: 12px; }
#image-dimensions { flex-shrink: 0; font-variant-numeric: tabular-nums; }

.upload {
  position: relative;
  display: grid;
  justify-items: center;
  align-content: center;
  gap: clamp(10px, 2vh, 18px);
  width: 100%;
  min-height: clamp(130px, 16vh, 180px);
  margin-top: 8px;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: #f8f8fa;
  color: var(--ink);
  text-align: center;
  transition: background .15s, border-color .15s;
}
.upload:hover, .upload.is-dragging { border-color: #80a767; background: var(--lime-soft); }
.upload:focus-within { outline: 2px solid var(--focus); outline-offset: 3px; }
.upload-input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.upload-pill {
  display: inline-flex;
  min-height: 33px;
  align-items: center;
  gap: 7px;
  padding: 4px 13px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: #fff;
  box-shadow: 0 1px 3px #18191a0d;
  color: var(--ink);
  font-size: 13px;
  font-weight: 630;
}
.upload-copy { display: grid; gap: 4px; }
.upload strong { font-size: 13px; font-weight: 550; }
.upload-formats, .message { color: var(--muted); font-size: 12px; }
.message { margin-top: 9px; line-height: 1.5; overflow-wrap: anywhere; }
.message[data-error="true"] { color: #9f2727; }
.adjust-section { display: flex; flex-direction: column; gap: var(--module-gap); }
.section-heading, .setting-heading { display: flex; align-items: center; justify-content: space-between; gap: 7px; }
.reset {
  min-height: 27px;
  padding: 3px 8px;
  border: 0;
  border-radius: var(--radius);
  background: var(--soft);
  color: var(--ink);
  font-size: 12px;
}
.reset:hover { background: #e9e9ee; }

.choices { min-width: 0; margin: 0; padding: 0; border: 0; }
.choices legend { margin-bottom: 7px; padding: 0; font-size: 13px; font-weight: 630; }
.mode-options, .shape-options { display: grid; gap: 8px; }
.mode-options { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.shape-options { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.choice { position: relative; cursor: pointer; }
.choice-tile {
  display: flex;
  min-height: 38px;
  align-items: center;
  justify-content: center;
  padding: 5px;
  border: 1px solid var(--control-line);
  border-radius: var(--radius);
  color: var(--ink);
  background: var(--panel);
  text-align: center;
  font-size: 12px;
}
.shape-options .choice-tile { min-height: 51px; background: var(--soft); }
.choice:hover .choice-tile { border-color: #a2a8af; }
.choice input:checked + .choice-tile {
  border-color: #92be72;
  background: var(--lime-soft);
  font-weight: 650;
}
.choice input:focus-visible + .choice-tile { outline: 2px solid var(--focus); outline-offset: 2px; }
.shape-icon { width: 21px; height: 21px; background: currentColor; }
.shape-square { width: 18px; height: 18px; }
.shape-triangle { width: 23.5px; height: 23.5px; }
.shape-circle, .shape-ring { border-radius: 50%; }
.shape-ring { border: 5px solid currentColor; background: transparent; }

.sliders { display: grid; gap: 11px; }
.setting { min-width: 0; }
.setting label { font-size: 13px; font-weight: 590; }
.parameter-value {
  display: flex;
  flex: 0 0 76px;
  align-items: center;
  gap: 4px;
  min-height: 29px;
  padding: 3px 7px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--soft);
  color: var(--ink);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
  cursor: ew-resize;
  touch-action: pan-y;
}
.parameter-value:focus-within { border-color: var(--focus); }
.parameter-value input {
  appearance: textfield;
  flex: 1;
  width: 0;
  min-width: 0;
  padding: 0;
  border: 0;
  color: inherit;
  background: transparent;
  text-align: right;
}
.parameter-value input:focus-visible { outline: none; }
.parameter-value input::-webkit-inner-spin-button,
.parameter-value input::-webkit-outer-spin-button { appearance: none; margin: 0; }
.parameter-unit { min-width: 2ch; color: var(--muted); white-space: nowrap; user-select: none; }
.parameter-grip {
  flex: 0 0 8px;
  height: 12px;
  margin-left: 3px;
  background: radial-gradient(circle, #92969e .8px, transparent 1.15px) 0 0 / 4px 4px;
  pointer-events: none;
}
.parameter-value.is-scrubbing input { cursor: ew-resize; user-select: none; }
.setting input[type="range"] {
  appearance: none;
  display: block;
  width: 100%;
  height: 24px;
  margin: 0;
  border-radius: var(--radius);
  background: transparent;
  cursor: pointer;
  accent-color: var(--focus);
}
.setting input::-webkit-slider-runnable-track {
  height: 4px;
  border-radius: var(--radius);
  background: linear-gradient(to right, var(--ink) var(--fill, 0%), #e5e6eb var(--fill, 0%));
}
.setting input::-webkit-slider-thumb {
  appearance: none;
  width: 14px;
  height: 14px;
  margin-top: -5px;
  border: 2px solid #fff;
  border-radius: 50%;
  background: var(--ink);
  box-shadow: 0 0 0 1px #adadb5;
}
.setting input::-moz-range-track { height: 4px; border-radius: var(--radius); background: #e5e6eb; }
.setting input::-moz-range-progress { height: 4px; border-radius: var(--radius); background: var(--ink); }
.setting input::-moz-range-thumb {
  width: 10px;
  height: 10px;
  border: 2px solid #fff;
  border-radius: 50%;
  background: var(--ink);
  box-shadow: 0 0 0 1px #adadb5;
}
.controls-footer {
  position: relative;
  z-index: 1;
  flex-shrink: 0;
  display: grid;
  gap: 10px;
  padding: 14px var(--side-padding) max(16px, env(safe-area-inset-bottom));
  border-top: 1px solid var(--line);
  background: var(--panel);
}
.image-size { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 12px; }
.export {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  width: 100%;
  min-height: 48px;
  padding: 8px 12px;
  border: 0;
  border-radius: var(--radius);
  background: var(--lime);
  color: var(--ink);
  font-size: 14px;
  font-weight: 720;
}
.export:hover:enabled { background: var(--lime-hover); }

html:lang(zh-CN) .brand,
html:lang(zh-CN) h2,
html:lang(zh-CN) .export { font-weight: 500; }
html:lang(zh-CN) .choice-tile,
html:lang(zh-CN) .choices legend,
html:lang(zh-CN) .setting label,
html:lang(zh-CN) .upload strong,
html:lang(zh-CN) .upload-pill,
html:lang(zh-CN) .view-switch button,
.language-zh { font-weight: 400; }

@media (max-width: 700px) {
  :root { --side-padding: 16px; --module-gap: 21px; }
  .topbar { height: 54px; }
  .brand { font-size: 16px; }
  .workspace { height: auto; grid-template-areas: "preview" "controls"; grid-template-columns: minmax(0, 1fr); }
  .preview-stage { height: clamp(265px, 76vw, 415px); padding: 53px 18px 16px; }
  .preview-header { top: 9px; }
  .controls { border: 0; border-top: 1px solid var(--line); }
  .controls-scroll { overflow: visible; }
  .controls-footer { position: sticky; bottom: 0; padding-top: 10px; }
  .upload { min-height: 108px; gap: 10px; }
  .sliders { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 17px; }
}
@media (prefers-reduced-motion: reduce) {
  .upload, .switch-track, .switch-track::after { transition: none; }
}
</style>
</head>
<body>
  <header class="topbar">
    <h1 class="brand"><span class="brand-mark" aria-hidden="true"></span><span data-i18n="brand">Dot Generator</span></h1>
    <label class="switch language-control">
      <span class="language-en" aria-hidden="true">EN</span>
      <input type="checkbox" id="language-switch" role="switch" aria-label="Use Chinese" data-i18n-label="useChinese">
      <span class="switch-track" aria-hidden="true"></span>
      <span class="language-zh" aria-hidden="true" lang="zh-CN">中文</span>
    </label>
  </header>

  <main class="workspace">
    <aside class="controls" aria-label="Image and halftone settings" data-i18n-label="controls">
      <div class="controls-scroll">
        <section class="source-section">
          <h2 data-i18n="import">Import image</h2>
          <label id="upload" class="upload">
            <input id="image-input" class="upload-input" type="file" accept=".jpg,.jpeg,.png,image/jpeg,image/png" aria-label="Choose a JPG or PNG image" data-i18n-label="chooseImage">
            <span class="upload-pill"><span aria-hidden="true">↑</span><span data-i18n="uploadButton">Upload</span></span>
            <span class="upload-copy">
              <strong data-i18n="upload">Choose or drop an image</strong>
              <span class="upload-formats">JPG / PNG</span>
            </span>
          </label>
          <p id="image-name" hidden>Sample image</p>
          <p id="message" class="message" role="status" hidden></p>
        </section>

        <section class="adjust-section">
          <div class="section-heading">
            <h2 data-i18n="settings">Halftone settings</h2>
            <button type="button" id="reset" class="reset" data-i18n="reset">Reset</button>
          </div>
          <fieldset class="choices">
            <legend data-i18n="colorMode">Color mode</legend>
            <div class="mode-options">
              <label class="choice">
                <input type="radio" name="mode" value="monochrome" checked>
                <span class="choice-tile" data-i18n="monochrome">Black &amp; white</span>
              </label>
              <label class="choice">
                <input type="radio" name="mode" value="color">
                <span class="choice-tile" data-i18n="color">Color</span>
              </label>
            </div>
          </fieldset>
          <fieldset class="choices">
            <legend data-i18n="pattern">Pattern</legend>
            <div class="shape-options">
              <label class="choice">
                <input type="radio" name="shape" value="circle" aria-label="Dot" data-i18n-label="dot" checked>
                <span class="choice-tile"><span class="shape-icon shape-circle" aria-hidden="true"></span></span>
              </label>
              <label class="choice">
                <input type="radio" name="shape" value="cross" aria-label="Cross" data-i18n-label="cross">
                <span class="choice-tile"><span class="shape-icon" aria-hidden="true"></span></span>
              </label>
              <label class="choice">
                <input type="radio" name="shape" value="square" aria-label="Square" data-i18n-label="square">
                <span class="choice-tile"><span class="shape-icon shape-square" aria-hidden="true"></span></span>
              </label>
              <label class="choice">
                <input type="radio" name="shape" value="ring" aria-label="Ring" data-i18n-label="ring">
                <span class="choice-tile"><span class="shape-icon shape-ring" aria-hidden="true"></span></span>
              </label>
              <label class="choice">
                <input type="radio" name="shape" value="triangle" aria-label="Triangle" data-i18n-label="triangle">
                <span class="choice-tile"><span class="shape-icon shape-triangle" aria-hidden="true"></span></span>
              </label>
              <label class="choice">
                <input type="radio" name="shape" value="plus" aria-label="Plus" data-i18n-label="plus">
                <span class="choice-tile"><span class="shape-icon" aria-hidden="true"></span></span>
              </label>
            </div>
          </fieldset>
          <div class="sliders">
            <div class="setting">
              <div class="setting-heading">
                <label for="size" id="size-label" data-i18n="size">Shape size</label>
                <div class="parameter-value" title="Drag sideways or type a value" data-i18n-title="parameterTip">
                  <input type="number" id="size-value" value="100" inputmode="numeric" aria-labelledby="size-label">
                  <span class="parameter-unit" aria-hidden="true">%</span>
                  <span class="parameter-grip" aria-hidden="true"></span>
                </div>
              </div>
              <input type="range" id="size" min="30" max="150" value="100">
            </div>
            <div class="setting">
              <div class="setting-heading">
                <label for="spacing" id="spacing-label" data-i18n="spacing">Spacing</label>
                <div class="parameter-value" title="Drag sideways or type a value" data-i18n-title="parameterTip">
                  <input type="number" id="spacing-value" value="9" inputmode="numeric" aria-labelledby="spacing-label">
                  <span class="parameter-unit" aria-hidden="true">px</span>
                  <span class="parameter-grip" aria-hidden="true"></span>
                </div>
              </div>
              <input type="range" id="spacing" min="4" max="36" value="9" title="Spacing for an image with a 1,200 px long edge" data-i18n-title="spacingTip">
            </div>
            <div class="setting">
              <div class="setting-heading">
                <label for="contrast" id="contrast-label" data-i18n="contrast">Contrast</label>
                <div class="parameter-value" title="Drag sideways or type a value" data-i18n-title="parameterTip">
                  <input type="number" id="contrast-value" value="115" inputmode="numeric" aria-labelledby="contrast-label">
                  <span class="parameter-unit" aria-hidden="true">%</span>
                  <span class="parameter-grip" aria-hidden="true"></span>
                </div>
              </div>
              <input type="range" id="contrast" min="0" max="200" value="115">
            </div>
            <div class="setting">
              <div class="setting-heading">
                <label for="angle" id="angle-label" data-i18n="angle">Grid angle</label>
                <div class="parameter-value" title="Drag sideways or type a value" data-i18n-title="parameterTip">
                  <input type="number" id="angle-value" value="45" inputmode="numeric" aria-labelledby="angle-label">
                  <span class="parameter-unit" aria-hidden="true">°</span>
                  <span class="parameter-grip" aria-hidden="true"></span>
                </div>
              </div>
              <input type="range" id="angle" min="0" max="90" value="45">
            </div>
          </div>
        </section>
      </div>
      <footer class="controls-footer">
        <div class="image-size"><span data-i18n="imageSize">Image size</span><span id="image-dimensions">—</span></div>
        <button type="button" id="export" class="export" data-i18n="export" disabled>Export PNG</button>
      </footer>
    </aside>

    <section class="preview" aria-label="Live preview" data-i18n-label="preview">
      <div class="preview-header">
        <div class="view-switch" role="group" aria-label="Preview mode" data-i18n-label="previewMode">
          <button type="button" id="original-view" aria-pressed="false" data-i18n="original">Original</button>
          <button type="button" id="effect-view" aria-pressed="true" data-i18n="effect">Halftone</button>
        </div>
        <div class="zoom-controls" role="group" aria-label="Preview zoom" data-i18n-label="previewZoom">
          <button type="button" id="zoom-out" aria-controls="preview-image" aria-label="Zoom out" data-i18n-label="zoomOut" title="Zoom out" data-i18n-title="zoomOut" disabled>−</button>
          <button type="button" id="zoom-reset" aria-controls="preview-image" title="Reset zoom to fit" data-i18n-title="zoomReset" disabled>
            <span class="visually-hidden" data-i18n="zoomReset">Reset zoom to fit</span>
            <span id="zoom-value">100%</span>
          </button>
          <button type="button" id="zoom-in" aria-controls="preview-image" aria-label="Zoom in" data-i18n-label="zoomIn" title="Zoom in" data-i18n-title="zoomIn" disabled>+</button>
        </div>
      </div>
      <div class="preview-stage">
        <p id="placeholder" class="placeholder">If the page stays here, save the HTML file and open it in a browser.</p>
        <div id="preview-image" class="preview-image" hidden>
          <canvas id="original" role="img" aria-label="Original image preview" data-i18n-label="originalPreview" hidden></canvas>
          <canvas id="effect" role="img" aria-label="Halftone image preview" data-i18n-label="effectPreview" hidden></canvas>
        </div>
      </div>
    </section>
  </main>
<script>
"use strict";

const input = document.querySelector("#image-input");
const upload = document.querySelector("#upload");

const effectView = document.querySelector("#effect-view");
const exportButton = document.querySelector("#export");

const zoomOut = document.querySelector("#zoom-out");

const modeOptions = [...document.querySelectorAll('input[name="mode"]')];
const colorMode = document.querySelector('input[name="mode"][value="color"]');
const shapeOptions = [...document.querySelectorAll('input[name="shape"]')];
const maxImageEdge = 2400;
const spacingReference = 1200;
const minZoom = 0.25;
const maxZoom = 16;
const zoomStep = 1.25;

function plusOutline(arm) {
  return [
    [-arm, -1], [arm, -1], [arm, -arm], [1, -arm],
    [1, arm], [arm, arm], [arm, 1], [-arm, 1],
    [-arm, arm], [-1, arm], [-1, -arm], [-arm, -arm],
  ];
}

const crossArm = 0.38;
const shapes = {
  cross: plusOutline(crossArm).map(([x, y]) => [(x - y) / (1 + crossArm), (x + y) / (1 + crossArm)]),
  square: [[-1, -1], [1, -1], [1, 1], [-1, 1]],
  triangle: [[0, -0.86], [1, 0.86], [-1, 0.86]],
  plus: plusOutline(5 / 21),
};

let luminance;
let sourcePixels;
let hasTransparency = false;
let frame;
let imageRequest = 0;
let sourceName = "";
let copy = translations.en;
let messageKey = "";
let placeholderKey = "loadingDemo";
let showOriginal = false;
let previewZoom = 1;
let previewX = 0;
let previewY = 0;
let previewDrag;

function setMessage(key, isError = false) {
  messageKey = key;
  message.textContent = key ? copy[key] : "";
  message.dataset.error = String(isError);
  message.hidden = !key;
}

function updateImageLabels() {
  const label = sourceName || (placeholderKey === "importToPreview" && !luminance ? copy.noImage : copy.sample);
  imageName.textContent = label;
  imageName.title = label;
  imageName.hidden = !sourceName;
  placeholder.textContent = copy[placeholderKey];
}

function updateLanguage() {
  const language = languageSwitch.checked ? "zh-CN" : "en";
  copy = translations[language];
  document.documentElement.lang = language;
  document.title = copy.title;
  for (const element of document.querySelectorAll("[data-i18n]")) {
    element.textContent = copy[element.dataset.i18n];
  }
  for (const element of document.querySelectorAll("[data-i18n-label]")) {
    element.setAttribute("aria-label", copy[element.dataset.i18nLabel]);
  }
  for (const element of document.querySelectorAll("[data-i18n-title]")) {
    element.title = copy[element.dataset.i18nTitle];
  }
  updateImageLabels();
  setMessage(messageKey, message.dataset.error === "true");
}

function updateView() {
  originalView.setAttribute("aria-pressed", String(showOriginal));
  effectView.setAttribute("aria-pressed", String(!showOriginal));
  original.hidden = !luminance || !showOriginal;
  effect.hidden = !luminance || showOriginal;
  previewImage.hidden = !luminance;
  placeholder.hidden = Boolean(luminance);
}

function updatePreviewTransform() {
  previewImage.style.transform = `translate(${previewX}px, ${previewY}px) scale(${previewZoom})`;
  previewStage.classList.toggle("can-pan", previewZoom > 1);
  zoomValue.textContent = `${Math.round(previewZoom * 100)}%`;
  zoomIn.disabled = !luminance || previewZoom === maxZoom;
  zoomOut.disabled = !luminance || previewZoom === minZoom;
  zoomReset.disabled = !luminance;
}

function movePreview(x, y) {
  const imageScale = Math.min(previewImage.clientWidth / effect.width, previewImage.clientHeight / effect.height);
  const limitX = Math.max(0, (previewStage.clientWidth + imageScale * effect.width * previewZoom) / 2 - 36);
  const limitY = Math.max(0, (previewStage.clientHeight + imageScale * effect.height * previewZoom) / 2 - 36);
  previewX = Math.max(-limitX, Math.min(limitX, x));
  previewY = Math.max(-limitY, Math.min(limitY, y));
  updatePreviewTransform();
}

function zoomPreview(value, clientX, clientY) {
  if (!luminance) return;
  const nextZoom = Math.max(minZoom, Math.min(maxZoom, value));
  if (nextZoom === previewZoom) return;

  const bounds = previewImage.getBoundingClientRect();
  const x = clientX === undefined ? 0 : clientX - (bounds.left + bounds.width / 2);
  const y = clientY === undefined ? 0 : clientY - (bounds.top + bounds.height / 2);
  const ratio = nextZoom / previewZoom;
  previewZoom = nextZoom;
  movePreview(previewX + x * (1 - ratio), previewY + y * (1 - ratio));
}

function resetPreviewZoom() {
  previewZoom = 1;
  previewX = previewY = 0;
  previewDrag = undefined;
  previewStage.classList.remove("is-panning");
  updatePreviewTransform();
}

function updateSlider(slider, syncField = true) {
  const fraction = (slider.valueAsNumber - Number(slider.min)) / (Number(slider.max) - Number(slider.min));
  slider.style.setProperty("--fill", `${fraction * 100}%`);
  if (syncField) document.getElementById(`${slider.id}-value`).value = slider.value;
}

function displayImage(image, name, isDemo) {
  const scale = Math.min(1, maxImageEdge / Math.max(image.naturalWidth, image.naturalHeight));
  const width = Math.max(1, Math.round(image.naturalWidth * scale));
  const height = Math.max(1, Math.round(image.naturalHeight * scale));
  original.width = effect.width = width;
  original.height = effect.height = height;

  originalContext.drawImage(image, 0, 0, width, height);

  sourcePixels = originalContext.getImageData(0, 0, width, height).data;
  luminance = new Uint8Array(width * height);
  hasTransparency = false;
  for (let index = 0; index < luminance.length; index++) {
    const pixel = index * 4;
    if (sourcePixels[pixel + 3] < 255) hasTransparency = true;
    luminance[index] = Math.round(
      sourcePixels[pixel] * 0.2126 + sourcePixels[pixel + 1] * 0.7152 + sourcePixels[pixel + 2] * 0.0722
    );
  }

  sourceName = name;
  updateImageLabels();
  imageDimensions.textContent = `${width} × ${height} px`;
  setMessage(!isDemo && scale < 1 ? "resized" : "");
  showOriginal = false;
  renderPending();
  updateView();
  resetPreviewZoom();
  exportButton.disabled = false;
}

function loadImage(source, name, isDemo = false) {
  const request = ++imageRequest;
  const image = new Image();
  if (!isDemo) setMessage("loadingImage");

  function failed() {
    if (!luminance) {
      placeholderKey = "importToPreview";
      updateImageLabels();
    }
    if (!isDemo) setMessage("unreadable", true);
  }

  image.onload = () => {
    try {
      if (request === imageRequest) displayImage(image, name, isDemo);
    } catch {
      if (request === imageRequest) failed();
    } finally {
      if (!isDemo) URL.revokeObjectURL(source);
    }
  };
  image.onerror = () => {
    if (!isDemo) URL.revokeObjectURL(source);
    if (request === imageRequest) failed();
  };
  image.src = source;
}

function importFile(file) {
  if (!file) return;
  const supportedType = ["image/jpeg", "image/png"].includes(file.type);
  const genericType = !file.type || file.type === "application/octet-stream";
  if (!supportedType && !(genericType && /\.(jpe?g|png)$/i.test(file.name))) {
    setMessage("invalidType", true);
    return;
  }
  loadImage(URL.createObjectURL(file), file.name);
}

function appendShape(context, points, ring, x, y, radius) {
  if (!points) {
    context.moveTo(x + radius, y);
    context.arc(x, y, radius, 0, 2 * Math.PI);
    if (ring) {
      // Reverse the inner contour so it stays open with the nonzero fill rule.
      const innerRadius = radius * (11 / 21);
      context.moveTo(x + innerRadius, y);
      context.arc(x, y, innerRadius, 0, -2 * Math.PI, true);
    }
    return;
  }
  const [firstX, firstY] = points[0];
  context.moveTo(x + firstX * radius, y + firstY * radius);
  for (let index = 1; index < points.length; index++) {
    const [offsetX, offsetY] = points[index];
    context.lineTo(x + offsetX * radius, y + offsetY * radius);
  }
  context.closePath();
}

function sampleColor(samples, totalAlpha) {
  let red = 0;
  let green = 0;
  let blue = 0;
  for (const index of samples) {
    const pixel = index * 4;
    const alpha = sourcePixels[pixel + 3];
    red += sourcePixels[pixel] * alpha;
    green += sourcePixels[pixel + 1] * alpha;
    blue += sourcePixels[pixel + 2] * alpha;
  }
  return `rgb(${Math.round(red / totalAlpha)}, ${Math.round(green / totalAlpha)}, ${Math.round(blue / totalAlpha)})`;
}

function render() {
  if (!luminance) return;

  const [size, spacing, contrast, angle] = sliders.map(slider => slider.valueAsNumber);
  const colored = colorMode.checked;
  const shape = document.querySelector('input[name="shape"]:checked').value;
  const points = shapes[shape];
  const ring = shape === "ring";
  const { width, height } = effect;
  const pitch = spacing * Math.max(width, height) / spacingReference;
  const maxRadius = (pitch / 2) * (size / 100);
  const radians = angle * Math.PI / 180;
  const cos = Math.cos(radians);
  const sin = Math.sin(radians);
  const centerX = width / 2;
  const centerY = height / 2;
  const gridMargin = maxRadius * (cos + sin);
  const gridX = Math.ceil((centerX * cos + centerY * sin + gridMargin) / pitch);
  const gridY = Math.ceil((centerX * sin + centerY * cos + gridMargin) / pitch);
  const along = pitch * cos / 4;
  const across = pitch * sin / 4;
  const contrastFactor = contrast / 100;
  const samples = new Uint32Array(5);

  function pixelIndex(x, y) {
    const column = Math.max(0, Math.min(width - 1, Math.floor(x)));
    const row = Math.max(0, Math.min(height - 1, Math.floor(y)));
    return row * width + column;
  }

  effectContext.fillStyle = "#fff";
  effectContext.fillRect(0, 0, width, height);
  effectContext.fillStyle = "#000";
  effectContext.beginPath();

  for (let row = -gridY; row <= gridY; row++) {
    for (let column = -gridX; column <= gridX; column++) {
      const x = centerX + pitch * (column * cos - row * sin);
      const y = centerY + pitch * (column * sin + row * cos);
      if (x < -maxRadius || x > width + maxRadius || y < -maxRadius || y > height + maxRadius) continue;

      samples[0] = pixelIndex(x, y);
      samples[1] = pixelIndex(x + along, y + across);
      samples[2] = pixelIndex(x - along, y - across);
      samples[3] = pixelIndex(x - across, y + along);
      samples[4] = pixelIndex(x + across, y - along);
      let weightedLuminance = 0;
      let totalAlpha = 0;
      for (const index of samples) {
        const alpha = sourcePixels[index * 4 + 3];
        weightedLuminance += luminance[index] * alpha;
        totalAlpha += alpha;
      }
      if (totalAlpha === 0) continue;
      const light = weightedLuminance / (totalAlpha * 255);
      const adjustedLight = Math.max(0, Math.min(1, (light - 0.5) * contrastFactor + 0.5));
      const radius = maxRadius * Math.sqrt(1 - adjustedLight);
      if (radius === 0) continue;

      if (colored) {
        effectContext.fillStyle = sampleColor(samples, totalAlpha);
        effectContext.beginPath();
      }
      appendShape(effectContext, points, ring, x, y, radius);
      if (colored) effectContext.fill();
    }
  }
  if (!colored) effectContext.fill();
  if (hasTransparency) {
    effectContext.save();
    effectContext.globalCompositeOperation = "destination-in";
    effectContext.drawImage(original, 0, 0);
    effectContext.restore();
  }
}

function updateEffect() {
  showOriginal = false;
  updateView();
  scheduleRender();
}

function scheduleRender() {
  if (frame !== undefined) return;
  frame = requestAnimationFrame(() => {
    frame = undefined;
    render();
  });
}

function renderPending() {
  if (frame !== undefined) cancelAnimationFrame(frame);
  frame = undefined;
  render();
}

previewStage.addEventListener("wheel", event => {
  if (!luminance || event.ctrlKey || event.metaKey || !event.deltaY) return;
  event.preventDefault();
  const unit = event.deltaMode === WheelEvent.DOM_DELTA_LINE ? 16
    : event.deltaMode === WheelEvent.DOM_DELTA_PAGE ? previewStage.clientHeight : 1;
  zoomPreview(previewZoom * Math.exp(-event.deltaY * unit / 500), event.clientX, event.clientY);
}, { passive: false });

previewStage.addEventListener("pointerdown", event => {
  if (previewZoom <= 1 || !event.isPrimary || event.button !== 0) return;
  previewDrag = { id: event.pointerId, x: event.clientX - previewX, y: event.clientY - previewY };
  previewStage.setPointerCapture(event.pointerId);
  previewStage.classList.add("is-panning");
});
previewStage.addEventListener("pointermove", event => {
  if (previewDrag?.id !== event.pointerId) return;
  movePreview(event.clientX - previewDrag.x, event.clientY - previewDrag.y);
});
previewStage.addEventListener("lostpointercapture", event => {
  if (previewDrag?.id !== event.pointerId) return;
  previewDrag = undefined;
  previewStage.classList.remove("is-panning");
});
zoomIn.addEventListener("click", () => zoomPreview(previewZoom * zoomStep));
zoomOut.addEventListener("click", () => zoomPreview(previewZoom / zoomStep));
zoomReset.addEventListener("click", resetPreviewZoom);

input.addEventListener("change", () => {
  importFile(input.files[0]);
  input.value = "";
});

upload.addEventListener("dragover", event => {
  if (!event.dataTransfer.types.includes("Files")) return;
  event.preventDefault();
  event.dataTransfer.dropEffect = "copy";
  upload.classList.add("is-dragging");
});
upload.addEventListener("dragleave", event => {
  if (!upload.contains(event.relatedTarget)) upload.classList.remove("is-dragging");
});
upload.addEventListener("drop", event => {
  event.preventDefault();
  upload.classList.remove("is-dragging");
  importFile(event.dataTransfer.files[0]);
});
window.addEventListener("dragover", event => {
  if (event.dataTransfer.types.includes("Files")) event.preventDefault();
});
window.addEventListener("drop", event => {
  if (event.dataTransfer.types.includes("Files")) event.preventDefault();
});

function bindParameter(slider) {
  const field = document.getElementById(`${slider.id}-value`);
  const scrubbingArea = field.parentElement;
  let drag;

  field.min = slider.min;
  field.max = slider.max;
  field.step = slider.step || "1";
  updateSlider(slider);

  function applyValue(value, syncField = true) {
    const previousValue = slider.value;
    // The range input handles rounding to the step and clamping out-of-range values.
    slider.value = value;
    updateSlider(slider, syncField);
    if (slider.value !== previousValue) updateEffect();
  }

  slider.addEventListener("input", () => {
    updateSlider(slider);
    updateEffect();
  });
  field.addEventListener("input", () => {
    if (Number.isFinite(field.valueAsNumber) && field.validity.valid) {
      applyValue(field.valueAsNumber, false);
    }
  });
  field.addEventListener("blur", () => {
    applyValue(Number.isFinite(field.valueAsNumber) ? field.valueAsNumber : slider.valueAsNumber);
  });
  field.addEventListener("keydown", event => {
    if (event.key !== "Enter") return;
    event.preventDefault();
    field.blur();
  });

  scrubbingArea.addEventListener("pointerdown", event => {
    if (!event.isPrimary || event.button !== 0) return;
    drag = { id: event.pointerId, x: event.clientX, value: slider.valueAsNumber };
    event.target.setPointerCapture(event.pointerId);
  });
  scrubbingArea.addEventListener("pointermove", event => {
    if (!drag || event.pointerId !== drag.id) return;
    const distance = event.clientX - drag.x;
    if (!drag.active && Math.abs(distance) < 4) return;
    drag.active = true;
    scrubbingArea.classList.add("is-scrubbing");
    event.preventDefault();
    applyValue(drag.value + Math.round(distance / 3) * Number(field.step));
  });
  scrubbingArea.addEventListener("lostpointercapture", event => {
    if (event.pointerId !== drag?.id) return;
    drag = undefined;
    scrubbingArea.classList.remove("is-scrubbing");
  });
}

for (const slider of sliders) bindParameter(slider);
for (const option of modeOptions) option.addEventListener("change", updateEffect);

for (const option of shapeOptions) {
  const points = shapes[option.value];
  if (points) {
    const icon = option.parentElement.querySelector(".shape-icon");
    const vertices = points.map(([x, y]) => `${(x + 1) * 50}% ${(y + 1) * 50}%`);
    icon.style.clipPath = `polygon(${vertices.join(", ")})`;
  }
  option.addEventListener("change", updateEffect);
}

document.querySelector("#reset").addEventListener("click", () => {
  for (const slider of sliders) {
    slider.value = slider.defaultValue;
    updateSlider(slider);
  }
  for (const option of modeOptions) option.checked = option.defaultChecked;
  for (const option of shapeOptions) option.checked = option.defaultChecked;
  updateEffect();
});

originalView.addEventListener("click", () => {
  showOriginal = true;
  updateView();
});
effectView.addEventListener("click", () => {
  showOriginal = false;
  updateView();
});

exportButton.addEventListener("click", () => {
  if (!luminance) return;
  if (frame !== undefined) renderPending();
  const exportName = sourceName.replace(/\.[^.]+$/, "") || copy.sample;
  const filename = `${exportName}-${copy.fileSuffix}.png`;
  effect.toBlob(blob => {
    if (!blob) {
      setMessage("exportError", true);
      return;
    }
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = filename;
    link.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }, "image/png");
});

languageSwitch.checked = false;
